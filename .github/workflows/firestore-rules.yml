name: Firestore rules

# Tests the rules and the freeze arithmetic on every change, and deploys the rules when a change
# to them reaches main. Deploying needs two things set once in the repository settings:
#   secret   FIREBASE_SERVICE_ACCOUNT  JSON key of a service account with the "Firebase Rules Admin" role
#   variable FIREBASE_PROJECT_ID       the Firebase project id

on:
  pull_request:
    paths:
      - firestore.rules
      - firebase.json
      - tests/**
      - src/app/shopping/lib/freeze.ts
      - package.json
      - package-lock.json
      - .github/workflows/firestore-rules.yml
  push:
    branches: [main]
    paths:
      - firestore.rules
      - firebase.json
      - tests/**
      - src/app/shopping/lib/freeze.ts
      - package.json
      - package-lock.json
      - .github/workflows/firestore-rules.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run test:unit
      - run: npm run test:rules

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - run: npx --yes firebase-tools@14 deploy --only firestore:rules --project "${{ vars.FIREBASE_PROJECT_ID }}" --non-interactive
